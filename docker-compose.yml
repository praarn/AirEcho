services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aq}
      POSTGRES_DB: ${POSTGRES_DB:-aq}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aq} -d ${POSTGRES_DB:-aq}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aq}:${POSTGRES_PASSWORD:-aq}@db:5432/${POSTGRES_DB:-aq}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-not-for-prod}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SYNTHETIC_INGEST: ${SYNTHETIC_INGEST:-true}
      INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-20}
      OPENAQ_BASE_URL: ${OPENAQ_BASE_URL:-https://api.openaq.org/v3}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
